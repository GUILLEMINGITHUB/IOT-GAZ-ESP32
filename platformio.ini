; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
lib_deps = 
	bogde/HX711@^0.7.5
	monitor_speed = 115200

[platformio]
default_envs = INTEGRATION_TOTALE

[env:1_MESURE_DE_MASSE]
extends = env:upesy_wroom
build_src_filter =
    -<*>
    +<1 MESURE DE MASSE/>

[env:2_TRANSMISSION_WIFI]
extends = env:upesy_wroom
build_src_filter =
    -<*>
    +<2 prog transmission wifi/>

[env:3_TRANSMISSION_MASSE_WIFI]
extends = env:upesy_wroom
build_src_filter =
    -<*>
    +<3 programme_transmission_masse_wifi/>

[env:4_MISE_EN_VEILLE]
extends = env:upesy_wroom
build_src_filter =
    -<*>
    +<4 programme_mise_en_veille/>

[env:INTEGRATION_TOTALE]
extends = env:upesy_wroom
build_src_filter =
    -<*>
    +<INTEGRATION_TOTALE/>
	